# ==============================================================================
# Auto-WG Peer B Configuration (e.g. Client / Local Machine or Peer B)
# ==============================================================================

peer_id: "peer-b"
remote_peer_id: "peer-a"

wireguard:
  # The local WireGuard interface name
  interface: "wg0"

  # The Base64 public key of the remote peer (peer-a)
  peer_public_key: "PEER_A_WIREGUARD_PUBLIC_KEY_BASE64="

  # Remote host address (Domain or Public IP of peer-a, without port)
  remote_host: "peer-a.example.com"

  # Operation mode: "wgctrl" (native Linux netlink) or "cli" / "awg" (AmneziaWG)
  mode: "wgctrl"
  command: "wg"

signaling:
  # Must match peer-a's secret_token!
  secret_token: "ChangeMeToASecureRandomString32Chars"
  timeout: 5s

  # 1. Cloudflare Worker (Serverless REST/KV - recommended primary)
  cloudflare:
    enabled: true
    url: "https://auto-wg-signaling.YOUR_NAME.workers.dev"

  # 2. VPS Relay (Fallback external lightweight relay)
  vps_relay:
    enabled: false
    url: "http://relay.example.com:8443"

  # 3. Direct Peer-to-Peer (Fallback direct signaling over HTTP/TCP)
  direct:
    enabled: false
    listen_addr: ":9443"
    remote_addr: "peer-a.example.com:9443"

monitor:
  check_interval: 3s
  handshake_timeout: 150s

  # Active in-tunnel ping for sub-10-second failure detection
  tunnel_ping:
    enabled: true
    target_ip: "10.0.0.1" # WireGuard internal IP of peer-a
    target_port: 51820
    interval: 2s
    failure_threshold: 4

negotiation:
  # Candidate port pool (must match or overlap with peer-a)
  candidate_ports:
    - "53"
    - "80"
    - "123"
    - "443"
    - "853"
    - "500"
    - "4500"
    - "51820"
    - "20000-20030"

  # If true, first try rotating local client ListenPort to break DPI 5-tuple filter
  quick_rebind_first: true
  quick_rebind_timeout: 8s
  probe_timeout: 12s

web:
  enabled: true
  listen_addr: "0.0.0.0:8081"
  # Optional Basic Auth:
  # username: "admin"
  # password: "password123"
