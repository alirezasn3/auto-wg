# ==============================================================================
# Auto-WG Peer A Configuration
# ==============================================================================

wireguard:
  # The local WireGuard interface name (default: "wg0")
  interface: "wg0"

  # Operation mode: "wgctrl" (native Netlink / UAPI) or "cli"
  mode: "wgctrl"

  # CLI command to use if mode is "cli": "wg" or "awg" (AmneziaWG)
  command: "wg"

  # NOTE: Neither `peer_public_key` nor `target_ip` are needed here!
  # Auto-WG automatically detects the single peer's public key and endpoint IP
  # directly from the WireGuard interface (wg0).

iptables:
  # Automatically install and manage the NAT PREROUTING redirect rule using go-iptables:
  # iptables -t nat -A PREROUTING -p udp --dport <port_range> -j REDIRECT --to-ports <listen_port>
  enabled: true

  # The local port range forwarded to your WireGuard listen port
  port_range: "20000-30000"

hunter:
  # The remote peer's forwarded port range
  remote_port_range: "20000-30000"

  # How often to check interface health
  check_interval: 3s

  # If handshake is older than this threshold, verify with ping before hunting
  handshake_timeout: 60s

  # Stagger window to coordinate turn-taking between peers without race conditions
  cycle_timeout: 8s

  # Active in-tunnel ICMP ping verification before hunting
  # Note: Target IP is automatically derived from the peer's AllowedIPs on wg0
  tunnel_ping:
    enabled: true
    interval: 2s
    failure_threshold: 3

web:
  # Modern web dashboard & configuration settings panel
  enabled: true
  listen_addr: "0.0.0.0:8080"

  # Optional HTTP Basic Auth:
  # username: "admin"
  # password: "changeMe123"
