# ==============================================================================
# Auto-WG Server Configuration (One Server -> Multiple Clients)
# ==============================================================================
# NOTE: Your /etc/wireguard/wg*.conf interface files do NOT need "ListenPort" or "Endpoint".
# Auto-WG automatically assigns a listen port from "port_range" and initializes the
# peer's remote endpoint from "target_ips" and "remote_port_range" on startup!

# Operation mode: "server" (maintains connections to one or more clients)
mode: "server"

# Optional shell commands executed after tunnels start (PostUp) and before stop (PreDown)
post_up:
  - "echo 'Auto-WG Server Started'"

pre_down:
  - "echo 'Auto-WG Server Stopping'"

# Managed client interfaces (each with disjoint port slices)
tunnels:
  - interface: "wg0"
    name: "Client-Alpha"
    # Destination IPs or domain names:
    # If machines are NOT behind NAT (both server and client have public IPs or IPv4/IPv6):
    # Set the client's public candidate IPs or domain name here.
    # Auto-WG will hunt bidirectionally from both sides and alternate between IPv4 and IPv6!
    # (If the client is behind NAT or dynamic IP, omit target_ips and the server will roam automatically).
    target_ips:
      - "203.0.113.10"      # Client Alpha public IPv4
      - "2001:db8::10"       # Client Alpha public IPv6 (bracketed automatically: [2001:db8::10]:port)
    port_range: "20000-24999"
    remote_port_range: "20000-24999"
    handshake_timeout: 60s
    cycle_timeout: 8s
    check_interval: 3s
    tunnel_ping:
      enabled: true
      target_ip: "10.0.0.2" # In-tunnel IP of Client Alpha
      interval: 2s
      failure_threshold: 3
    history_file: "history-wg0.json"
    iptables: true

  - interface: "wg1"
    name: "Client-Bravo"
    port_range: "25000-29999"
    remote_port_range: "25000-29999"
    handshake_timeout: 60s
    cycle_timeout: 8s
    check_interval: 3s
    tunnel_ping:
      enabled: true
      target_ip: "10.1.0.2" # In-tunnel IP of Client Bravo
      interval: 2s
      failure_threshold: 3
    history_file: "history-wg1.json"
    iptables: true

  # --------------------------------------------------------------------------
  # Example 3: Passive / MikroTik Tunnel (No Port Hunting)
  # Standard WireGuard peers/routers (like MikroTik RouterOS) do not run Auto-WG
  # and use fixed listening ports. Set `passive: true` (or `hunting: false`) so
  # Auto-WG will monitor uptime, in-tunnel ping, and telemetry on the web
  # dashboard WITHOUT rotating ports or breaking the MikroTik link!
  # --------------------------------------------------------------------------
  - interface: "wg2"
    name: "Branch-MikroTik"
    passive: true             # Monitor only: do not hunt or rotate ports
    iptables: false           # Do not manage iptables port forwarding (uses static WireGuard port)
    tunnel_ping:
      enabled: true
      target_ip: "10.2.0.2"   # In-tunnel IP of MikroTik router
      interval: 2s
      failure_threshold: 3
    history_file: "history-wg2.json"

web:
  enabled: true
  listen_addr: "0.0.0.0:8080"
  allowed_ips:
    - "127.0.0.1"
    - "10.0.0.0/8"
    - "192.168.0.0/16"

status_page:
  enabled: true
  listen_addr: "0.0.0.0:8081"
  title: "VPN Gateway Status"
