# ==============================================================================
# Auto-WG Client Configuration (Upstream Failover & Routing Table 200)
# ==============================================================================
# NOTE: Your /etc/wireguard/wgBridge*.conf interface files do NOT need "ListenPort" or "Endpoint".
# Auto-WG automatically assigns a listen port from "port_range" and initializes the
# peer's remote endpoint from "target_ips" and "remote_port_range" on startup!

# Operation mode: "client" (one of multiple upstream connections is chosen based on availability)
mode: "client"

# Shell commands executed when Auto-WG starts (PostUp)
# Perfect for setting up policy routing (e.g., Table 200), firewall rules, and NAT
post_up:
  - "ip rule add to 10.0.0.1 lookup local priority 100"
  - "ip rule add from 10.0.0.0/16 lookup 200 priority 200"
  - "ip rule add to 192.168.69.0/24 lookup 200 priority 201"
  - "ip route add 10.0.0.0/16 dev wgServer table 200"
  - "iptables -t nat -I POSTROUTING -o wgBridge+ -j MASQUERADE"
  - "ufw route allow in on wgServer out on wgBridge+"
  - "ufw route allow in on wgBridge+ out on ens192"

# Shell commands executed when Auto-WG shuts down (PreDown)
pre_down:
  - "iptables -t nat -D POSTROUTING -o wgBridge+ -j MASQUERADE"
  - "ip rule del from 10.0.0.0/16 lookup 200 priority 200"
  - "ip rule del to 10.0.0.1 lookup local priority 100"
  - "ip rule del to 192.168.69.0/24 lookup 200 priority 201"

# Automatic route management
routing:
  enabled: true             # Automatically manage default route failover
  table: 200                # Target routing table (e.g. 200, leaves host main table and SSH untouched)
  mode: "sticky"            # "sticky" (stay on active until it fails, avoiding flaps) or "priority" (prefer first tunnel)
  metric: 100               # Default route metric

# Upstream tunnels to foreign servers
tunnels:
  - interface: "wgBridge0"
    name: "Upstream-Main"
    # Destination IPs or domain names:
    # If your upstream server supports both IPv4 and IPv6, or multiple endpoints, Auto-WG will
    # round-robin between them during hunting when DPI drops or censors one protocol!
    target_ips:
      - "198.51.100.1"      # IPv4 upstream destination
      - "2001:db8::1"       # IPv6 upstream destination (bracketed automatically: [2001:db8::1]:port)
    port_range: "20000-24999"
    remote_port_range: "20000-24999"
    handshake_timeout: 60s
    cycle_timeout: 8s
    check_interval: 3s
    tunnel_ping:
      enabled: true
      target_ip: "10.100.0.1" # In-tunnel IP of upstream server
      interval: 2s
      failure_threshold: 3
    history_file: "history-wgBridge0.json"
    iptables: true
    # Transport: "direct" (default, UDP with port hunting), "tls" or "ssh". With tls or ssh the ranges
    # above are TCP ranges and this tunnel does not hunt UDP ports; create one interface per transport
    # and switch between them yourself. See the README section "WireGuard over TLS or SSH".
    # transport: tls
    # tls:
    #   secret: "change-me-to-a-long-random-string"   # identical on both peers
    #   padding: bucket       # off | bucket | random
    #   reconnect_after: 10s  # rebuild the connection when WireGuard stays dead this long
    #   sni: "www.example.com"
    #   alpn: ["h2", "http/1.1"]
    #
    # transport: ssh
    # ssh:
    #   secret: "change-me-to-a-long-random-string"
    #   user: autowg
    #   identity_file: /etc/auto-wg/id_ed25519   # setting it makes this peer dial
    #   host_key: "ssh-ed25519 AAAA..."          # the peer's /etc/ssh/ssh_host_ed25519_key.pub
    #   sshd_port: 22
    #   link_port: 40022

  - interface: "wgBridge1"
    name: "Upstream-Backup"
    # Run this tunnel on AmneziaWG instead of stock WireGuard (needs the awg tool, and an
    # interface created with awg-quick; see the AmneziaWG section of the README):
    # backend: "amneziawg"
    target_ip: "198.51.100.2" # Single IP fallback format also supported
    port_range: "25000-29999"
    remote_port_range: "25000-29999"
    handshake_timeout: 60s
    cycle_timeout: 8s
    check_interval: 3s
    tunnel_ping:
      enabled: true
      target_ip: "10.200.0.1"
      interval: 2s
      failure_threshold: 3
    history_file: "history-wgBridge1.json"
    iptables: true

web:
  enabled: true
  listen_addr: "0.0.0.0:8080"
  # Restrict web dashboard access to specific client IP addresses or CIDR subnets:
  allowed_ips:
    - "127.0.0.1"
    - "::1"
    - "10.0.0.0/8"
    - "192.168.0.0/16"

status_page:
  enabled: true
  listen_addr: "0.0.0.0:8081"
  title: "Upstream Bridge Status"
