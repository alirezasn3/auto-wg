name: release

# Pushing a tag like v0.1.0 tests the code, builds a binary per platform and publishes a GitHub release.
# `autowg -update` and the dashboard's update button install from these releases: the files must be named
# autowg_<os>_<arch> and checksums.txt must list their SHA-256 sums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/autowg_${os}_${arch} ./cmd/autowg
          done
          (cd dist && sha256sum autowg_* > checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
